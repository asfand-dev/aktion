# ---------------------------------------------------------------------------
# Aktion JetBrains plugin — build configuration
#
# Every version here is deliberately pinned so a release is reproducible.
# See docs/README.md § "Bumping the platform" before changing platformVersion.
# ---------------------------------------------------------------------------

pluginGroup = dev.aktion

# NOTE: there is deliberately no `pluginName` property here. The plugin's DISPLAY
# name comes from `<name>Aktion</name>` in plugin.xml (setting
# `pluginConfiguration.name` would override it with a slug, which reads badly on
# the Marketplace), and the sandbox DIRECTORY name comes from `rootProject.name`
# in settings.gradle.kts — which is what `prepareSandbox`'s `pluginName` provider
# resolves to, and what the `server/` and `textmate/` copies are nested under.

# Kept in lockstep with the runtime (`package.json`) and the VS Code extension,
# so a user can tell at a glance which runtime a plugin build corresponds to.
pluginVersion = 0.5.15

# 242 == 2024.2, the first build LSP4IJ supports. `untilBuild` is intentionally
# left open in build.gradle.kts so the plugin keeps working on newer IDEs.
pluginSinceBuild = 242

# The IDE we compile against. `IC` (IntelliJ IDEA Community) is the lowest
# common denominator: a plugin compiled against it loads in every JetBrains IDE
# — WebStorm, IDEA Ultimate, PyCharm, PhpStorm, GoLand, RubyMine, CLion,
# Rider, Android Studio — because it uses only platform + LSP4IJ APIs.
platformType = IC
platformVersion = 2024.2.5

# JetBrains Marketplace plugins we depend on at compile + run time.
# LSP4IJ (https://plugins.jetbrains.com/plugin/23257-lsp4ij) is the LSP client.
platformPlugins = com.redhat.devtools.lsp4ij:0.20.1

# Bundled platform plugins. TextMate ships with every IDE and supplies the
# lexical syntax colouring (from the same generated grammar the VS Code
# extension uses).
platformBundledPlugins = org.jetbrains.plugins.textmate

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 8.14.3

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
