<!DOCTYPE html>
<html lang="en" data-showcase="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Component showcase · Aktion</title>
  <meta name="description" content="Every built-in Aktion component on one page, rendered live with realistic content. This page is also what CI screenshots for every pull request." />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    html, body { margin: 0; }
    /* The shadow root paints the theme background on the host; the page
       behind it is synced to the same colour once the theme is applied, so a
       dark theme never shows a white rubber-band edge. */
    html { background: #ffffff; }
    aktion-app#showcase { display: block; min-height: 100vh; }
    .showcase-error {
      display: none;
      margin: 24px auto;
      max-width: 820px;
      padding: 16px 18px;
      border: 1px solid #f3b4b4;
      border-radius: 12px;
      background: #fff0f0;
      color: #7a1c1c;
      font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
    html[data-showcase-error] .showcase-error { display: block; }
  </style>
</head>
<body>
  <div class="showcase-error" id="showcase-error" role="alert"></div>
  <aktion-app id="showcase" src="showcase.aktion" theme="light" margin="0"></aktion-app>

  <script>
    // Theme from ?theme=<name>, so a link (or the screenshot job) can pin one.
    // Set before the element upgrades, so the first paint is already themed.
    (function () {
      var THEMES = [
        "light", "dark", "soft",
        "shadcn", "shadcn-light", "shadcn-dark",
        "mui", "mui-light", "mui-dark",
        "heroui", "heroui-light", "heroui-dark",
        "signal", "signal-light", "signal-dark"
      ];
      var requested = new URLSearchParams(location.search).get("theme");
      if (requested && THEMES.indexOf(requested) !== -1) {
        document.getElementById("showcase").setAttribute("theme", requested);
      }
      window.SHOWCASE_THEMES = THEMES;
    })();
  </script>

  <!-- lottie-web, so the Lottie specimen animates instead of showing its poster. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

  <!-- The LOCAL build, not the CDN: this page shows what this commit renders. -->
  <script type="module">
    import "../dist/aktion.js";

    const root = document.documentElement;
    const app = document.getElementById("showcase");
    const errorBox = document.getElementById("showcase-error");

    // Readiness contract with scripts/capture-showcase.mjs: `data-showcase` on
    // <html> goes loading -> ready (or -> timeout). The program announces it
    // has mounted by emitting `showcase:ready`; the page then waits for web
    // fonts and images, so the screenshot never catches a half-loaded page.
    //
    // With ?capture=1, lazy images and iframes (Map) are switched to eager
    // first, so they load before the page reports ready instead of whenever
    // they come into view. Visitors keep lazy loading. Iframes are not waited
    // on (a `load` that already happened cannot be observed); the capture
    // script's network-idle wait covers them.
    const CAPTURE = new URLSearchParams(location.search).get("capture") === "1";
    const READY_TIMEOUT_MS = 30000;
    const MEDIA_WAIT_MS = 20000;

    function syncBackground() {
      const bg = getComputedStyle(app).backgroundColor;
      if (bg && bg !== "rgba(0, 0, 0, 0)") root.style.background = bg;
    }

    // Every element matching `selector` in the shadow tree, nested <aktion-app>s included.
    function deepQuery(node, selector, out = []) {
      for (const el of node.querySelectorAll(selector)) out.push(el);
      for (const el of node.querySelectorAll("*")) {
        if (el.shadowRoot) deepQuery(el.shadowRoot, selector, out);
      }
      return out;
    }

    function settled(img) {
      if (img.complete) return Promise.resolve();
      return new Promise((resolve) => {
        img.addEventListener("load", resolve, { once: true });
        img.addEventListener("error", resolve, { once: true });
      });
    }

    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    // A hidden tab never runs requestAnimationFrame; a short timer stands in.
    const frame = () => new Promise((resolve) => {
      requestAnimationFrame(() => resolve());
      setTimeout(resolve, 100);
    });
    const frames = async (n) => { for (let i = 0; i < n; i += 1) await frame(); };

    let readyStarted = false;
    async function markReady() {
      if (readyStarted) return;
      readyStarted = true;
      syncBackground();
      // The program has mounted; give deferred-to-paint widgets and the nested
      // CodeWindow preview a moment before collecting media.
      await frames(2);
      if (CAPTURE) {
        for (const el of deepQuery(app.shadowRoot, "img[loading=lazy], iframe[loading=lazy]")) el.loading = "eager";
      }
      const imgs = deepQuery(app.shadowRoot, "img").filter((img) => img.loading !== "lazy");
      const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      // One slow image must not hold the screenshot hostage.
      await Promise.race([Promise.all([fonts, ...imgs.map(settled)]), delay(MEDIA_WAIT_MS)]);
      await frames(2);
      if (root.dataset.showcase === "loading") root.dataset.showcase = "ready";
    }

    app.addEventListener("showcase:ready", () => {
      markReady().catch((err) => console.warn("[showcase] readiness check failed", err));
    });

    function applyTheme(theme) {
      app.setAttribute("theme", theme);
      const url = new URL(location.href);
      url.searchParams.set("theme", theme);
      history.replaceState(null, "", url);
      requestAnimationFrame(syncBackground);
    }

    // The program's theme picker emits `showcase:theme`; the host owns the
    // `theme` attribute, so it applies the change and keeps the URL shareable.
    app.addEventListener("showcase:theme", (event) => {
      const theme = event.detail && event.detail.theme;
      if (theme && window.SHOWCASE_THEMES.indexOf(theme) !== -1) applyTheme(theme);
    });

    // ThemeToggle flips the attribute itself; mirror it into the URL and the
    // program's picker so both stay in step.
    app.addEventListener("theme-change", () => {
      const theme = app.getAttribute("theme") || "light";
      applyTheme(theme);
      app.setState("activeTheme", theme);
    });

    app.addEventListener("error", (event) => {
      const detail = event.detail || {};
      const errors = Array.isArray(detail.errors) ? detail.errors : [];
      const text = errors.length
        ? errors.map((e) => (e.line ? `Line ${e.line}: ` : "") + e.message).join("\n")
        : (detail.message || "Unknown runtime error");
      errorBox.textContent = text;
      root.setAttribute("data-showcase-error", "");
      console.error("[showcase]", text);
    });

    setTimeout(() => {
      if (root.dataset.showcase === "loading") root.dataset.showcase = "timeout";
    }, READY_TIMEOUT_MS);

    await customElements.whenDefined("aktion-app");
    syncBackground();
  </script>
</body>
</html>
