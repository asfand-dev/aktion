<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aktion Demos · Live runner</title>
  <meta name="description" content="A single shell that renders any bundled Aktion demo from this folder. Pick one with ?app=<folder>/<file>.aktion." />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('doc-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-doc-theme', theme);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="../assets/site.css?v=2026.06.14" />
  <!-- Font Awesome (icons referenced by the apps) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; }
    .runner-group { display: inline-flex; align-items: center; gap: 7px; }
    .runner-group label { font-size: 12px; font-weight: 500; color: var(--doc-text-muted); white-space: nowrap; }
    .runner-bar select {
      background: var(--doc-surface);
      color: var(--doc-text);
      border: 1px solid var(--doc-border);
      border-radius: var(--doc-radius-sm);
      padding: 6px 9px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      max-width: 230px;
    }
    .runner-bar select:focus-visible { outline: 2px solid var(--doc-primary); outline-offset: 1px; }
    .runner-source-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--doc-text);
      background: var(--doc-surface);
      border: 1px solid var(--doc-border);
      border-radius: var(--doc-radius-sm);
      padding: 6px 11px;
      white-space: nowrap;
      transition: border-color var(--doc-transition), color var(--doc-transition);
    }
    .runner-source-link:hover { border-color: var(--doc-primary); color: var(--doc-text); }
    .runner-stage { flex: 1 1 auto; overflow: auto; background: var(--doc-bg); }
    aktion-app { display: block; min-height: 100%; }
    .runner-error {
      display: none;
      margin: 18px auto;
      max-width: 820px;
      background: #fff0f0;
      border: 1px solid #f3b4b4;
      color: #7a1c1c;
      border-radius: var(--doc-radius-md);
      padding: 16px 18px;
      font-size: 13.5px;
      white-space: pre-wrap;
    }
    .runner-error.show { display: block; }
    .runner-error h3 { margin: 0 0 6px; font-size: 14px; }
    /* Embedded preview mode (live-demos.html cards): chrome-less program only. */
    body[data-embed] .topbar { display: none; }
    main { padding: 0; }
    /* Phones: let the runner toolbar wrap instead of overflowing; selects flex
       to the available width. */
    @media (max-width: 760px) {
      .runner-bar { height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 8px 12px; }
      .runner-bar .topbar-spacer { display: none; }
      .runner-group { flex: 1 1 auto; min-width: 0; }
      .runner-group select { flex: 1 1 auto; min-width: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <header class="topbar runner-bar" role="banner">
    <a class="topbar-brand" href="../index.html">
      <img class="topbar-brand-mark" src="../assets/logo.png" alt="" aria-hidden="true" width="28" height="28" />
      <span>Aktion</span>
      <span class="topbar-version">Demos</span>
    </a>
    <span class="runner-group">
      <label for="app-picker">App</label>
      <select id="app-picker"></select>
    </span>
    <span class="runner-group">
      <label for="theme-picker">Theme</label>
      <select id="theme-picker">
        <option value="light">light</option>
        <option value="dark">dark</option>
        <option value="neon">neon</option>
        <option value="pastel">pastel</option>
        <option value="glass">glass</option>
        <option value="brutalist">brutalist</option>
        <option value="skyline">skyline</option>
      </select>
    </span>
    <span class="topbar-spacer"></span>
    <a class="runner-source-link" id="source-link" href="../playground.html" target="_blank" rel="noopener">
      <i class="fa-solid fa-code" aria-hidden="true"></i> View .aktion source
    </a>
  </header>
  <main class="runner-stage">
    <div class="runner-error" id="error-box"></div>
    <aktion-app id="app" theme="light" data-theme-managed="true"></aktion-app>
  </main>

  <!-- Load the LOCAL build (not the CDN — it lags behind this repo's runtime) -->
  <script type="module">
    import "../../dist/aktion.js";

    const DEFAULT_APP = "mini-apps/aktion-website.aktion";

    const el        = document.getElementById("app");
    const picker    = document.getElementById("app-picker");
    const themePick = document.getElementById("theme-picker");
    const srcLink   = document.getElementById("source-link");
    const errBox    = document.getElementById("error-box");

    if (new URLSearchParams(location.search).has("embed")) {
      document.body.setAttribute("data-embed", "");
    }

    const titleCase = (slug) =>
      slug.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    const programName = (file) => titleCase(file.replace(/\.aktion$/, ""));

    // The static host cannot list directories, so the picker is populated
    // from the generated manifest (mini-apps first, then the other folders).
    const manifest = await fetch("./manifest.json").then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status} fetching manifest.json`);
      return r.json();
    });
    const ALL = Object.entries(manifest).flatMap(([folder, files]) =>
      files.map((file) => `${folder}/${file}`));

    picker.innerHTML = Object.entries(manifest).map(([folder, files]) => {
      const options = files
        .map((file) => `<option value="${folder}/${file}">${programName(file)}</option>`)
        .join("");
      return `<optgroup label="${titleCase(folder)}">${options}</optgroup>`;
    }).join("");

    function currentApp() {
      const q = new URLSearchParams(location.search).get("app");
      return ALL.includes(q) ? q : DEFAULT_APP;
    }

    // Same encoding as the playground's share links (#code=gzip+base64url),
    // so "View .aktion source" opens the program ready to edit live.
    async function encodeShare(text) {
      const bytes = new TextEncoder().encode(text);
      let compressed = bytes;
      if (typeof CompressionStream !== "undefined") {
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
          compressed = new Uint8Array(await new Response(stream).arrayBuffer());
        } catch { /* fall back to raw bytes */ }
      }
      return btoa(String.fromCharCode(...compressed))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function load(app) {
      picker.value = app;
      errBox.classList.remove("show");
      errBox.textContent = "";
      try {
        const res = await fetch(`./${app}?ts=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${app}`);
        const code = await res.text();
        encodeShare(code).then((encoded) => {
          srcLink.href = `../playground.html#code=${encoded}`;
        });
        await customElements.whenDefined("aktion-app");
        el.setResponse(code);
      } catch (e) {
        showError("Failed to load program", String(e && e.stack || e));
      }
    }

    function showError(title, body) {
      errBox.innerHTML = `<h3>${title}</h3>`;
      errBox.appendChild(document.createTextNode(body || ""));
      errBox.classList.add("show");
    }

    // Surface runtime/parse errors the element emits.
    el.addEventListener("error", (ev) => {
      const d = ev.detail || {};
      showError("Aktion runtime error", d.message || JSON.stringify(d, null, 2) || String(ev));
    });

    picker.addEventListener("change", () => {
      const url = new URL(location.href);
      url.searchParams.set("app", picker.value);
      history.replaceState(null, "", url);
      load(picker.value);
    });
    themePick.addEventListener("change", () => el.setAttribute("theme", themePick.value));

    load(currentApp());
  </script>
</body>
</html>
