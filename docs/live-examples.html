<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live examples · Aktion</title>
  <meta name="description" content="Standalone, full-page Aktion demos. Pick one to open its live preview and source." />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('doc-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-doc-theme', theme);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/site.css?v=2026.05.13" />
  <style>
    .live-list {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      border: 1px solid var(--doc-border);
      border-radius: var(--doc-radius-md);
      background: var(--doc-surface);
      overflow: hidden;
    }
    .live-list li + li { border-top: 1px solid var(--doc-border); }
    .live-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
    }
    .live-list-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--doc-text);
    }
    .live-list-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--doc-primary);
      text-decoration: none;
      white-space: nowrap;
    }
    .live-list-link:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body data-page="live-demos">
  <div class="layout" data-wide="true">
    <aside class="sidebar"></aside>

    <main>
      <header class="hero">
        <span class="hero-eyebrow">Live examples</span>
        <h1>Live examples</h1>
        <p class="lead">Standalone, full-page Aktion programs. Open any demo to see its live preview and source.</p>
      </header>

      <ul class="live-list" id="live-list"></ul>
    </main>
  </div>

  <script type="module" src="assets/site.js?v=2026.05.13"></script>
  <script type="module">
    import { EXAMPLES } from "./assets/live-example.js";

    const list = document.getElementById("live-list");
    list.innerHTML = EXAMPLES.map((ex) => `
      <li>
        <div class="live-list-row">
          <span class="live-list-name">${ex.name}</span>
          <a class="live-list-link" href="live-example.html?example=${ex.slug}">Open demo &rarr;</a>
        </div>
      </li>
    `).join("");
  </script>
</body>
</html>
