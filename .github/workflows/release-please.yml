name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # WHY A PAT, NOT THE DEFAULT GITHUB_TOKEN
      # -----------------------------------------------------------------
      # release-please-action pushes/updates its release PR using this
      # token, which makes the pusher's actor `github-actions[bot]`.
      # GitHub's loop-prevention rule for GITHUB_TOKEN-originated events
      # doesn't just block that push from re-triggering `push`/
      # `pull_request` workflows directly — it also breaks the
      # `workflow_run` chain ONE HOP further downstream: the resulting
      # `pull_request`-triggered `preview.yml` build still runs fine, but
      # its completion never fires `deploy-preview.yml`'s `workflow_run`
      # trigger. The preview is silently never deployed, and the
      # "Get console logs"/"Take a screenshot" checks poll a 404 for 10
      # minutes and fail — every single time release-please opens or
      # updates its release PR (e.g. PR #19).
      #
      # A PAT (or GitHub App installation token) makes the push's actor a
      # real account instead, which isn't subject to that restriction and
      # lets `workflow_run` fire normally — exactly like it does for every
      # human-authored PR. `RELEASE_PLEASE_TOKEN` needs `contents:write`
      # and `pull-requests:write` on this repo (a fine-grained PAT scoped
      # to just this repo, or a GitHub App installation token, both work).
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-npm:
    needs: [release-please]
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
