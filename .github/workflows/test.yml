name: "Test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Make sure the unit tests pass.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  vite-matrix:
    runs-on: ubuntu-latest
    name: The Vite plugin works on Vite ${{ matrix.vite }}.
    strategy:
      fail-fast: false
      matrix:
        vite: [5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build the plugin
        run: npm run build:plugin
      - name: Build, dev-transform, scan and HMR a mixed .aktion / .aktion.ts / .aktion.js app
        run: node scripts/vite-matrix.mjs ${{ matrix.vite }}
        env:
          AKTION_VITE_MATRIX_CONTROL: '1'
