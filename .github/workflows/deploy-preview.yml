name: Deploy PR preview (trusted)

# WHY THIS IS A SEPARATE WORKFLOW, TRIGGERED BY `workflow_run`
# ---------------------------------------------------------------------------
# "Deploy PR previews" (preview.yml) builds every PR — including one from a
# fork — with `npm ci && npm run build:preview`. That means it runs code
# an external contributor wrote, so GitHub forces its `GITHUB_TOKEN` to be
# read-only for any fork PR, no matter what `permissions:` that workflow
# claims. `rossjrw/pr-preview-action` needs to `git push` to `gh-pages`,
# which a read-only token can't do — so previously that step (and the two
# after it) just skipped for fork PRs entirely, and the downstream console-
# log/screenshot checks failed every time waiting on a preview that was
# never deployed.
#
# A `workflow_run` job is the standard, secure way around this: it ALWAYS
# executes using the workflow file as committed on the repository's default
# branch (never the PR branch, fork or not), gets a normal write-capable
# token, and — this is the part that keeps it safe — never checks out or
# executes the PR's own code. This is the pattern GitHub's own docs
# recommend for "build untrusted, deploy trusted" — see "Preventing pwn
# requests" in their Actions security guide.
#
# Do NOT add a `pull_request` trigger to this workflow, and do NOT make the
# `deploy` job depend on anything checked out from the triggering PR's ref —
# either would reintroduce exactly the risk this split exists to avoid.
#
# WHERE THE PR NUMBER AND DEPLOY-VS-REMOVE DECISION COME FROM — AND WHERE
# THEY MUST NEVER COME FROM
# ---------------------------------------------------------------------------
# An earlier version of this workflow trusted a `pr-metadata` artifact that
# `preview.yml` produced, naming its own PR number and triggering action.
# That was a real vulnerability: `preview.yml` is a `pull_request`-triggered
# workflow, which means it runs using the WORKFLOW FILE FROM THE PR'S OWN
# BRANCH — so a malicious PR could edit that step to write any PR number and
# any action it liked (e.g. claim to be a completely different, real PR,
# with action "remove"), and this job would have deployed or deleted that
# OTHER PR's preview on the strength of nothing but the attacker's say-so.
#
# `resolve-pr` below derives both facts itself instead, from data the
# triggering PR's own code can never influence: `github.event.workflow_run
# .head_sha` is populated by GitHub's own event system from the actual
# commit that was built, not from anything inside that build. It asks the
# REST API which PR that commit belongs to (`GET /commits/{sha}/pulls`) and
# what that PR's CURRENT state is (`GET /pulls/{number}`) — never what a
# workflow run claimed about itself. The only artifact this workflow still
# downloads is the built `site/` — static content that only ever lands
# under the SAME PR number this job independently verified, so a fork
# controlling its own preview's content is expected and harmless.

on:
  workflow_run:
    workflows: ["Deploy PR previews"]
    types:
      - completed

# Every PR's deploy writes to the same `gh-pages` branch, so concurrent
# deploys from different PRs (or a deploy racing a removal) must be
# serialised — the same reasoning `preview.yml` used to state here before
# this split moved the actual writing to this workflow. cancel-in-progress:
# false ensures a queued run still executes (important for the "closed"
# event that removes a preview).
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      pr-action: ${{ steps.resolve.outputs.pr-action }}
    steps:
      - name: Resolve PR number and lifecycle state from the GitHub API
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # The commit a workflow_run was triggered by can, in principle, be
          # associated with more than one PR (e.g. after a rebase onto
          # another PR's tip) — picking the first is fine here: we only need
          # A pull request this exact commit really belongs to, and every
          # match is equally real, GitHub-verified data, never something the
          # PR's own code could have claimed.
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "::error::No pull request found for commit ${HEAD_SHA} — nothing to deploy."
            exit 1
          fi

          # Deploy for an open PR, remove for anything else (closed, with or
          # without having been merged) — read fresh from the API, not from
          # the ORIGINAL triggering event, since by the time this runs the
          # PR could already have moved on again.
          state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.state')
          action="deploy"
          if [ "$state" != "open" ]; then
            action="remove"
          fi

          echo "pr-number=$number" >> "$GITHUB_OUTPUT"
          echo "pr-action=$action" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-pr
    runs-on: ubuntu-latest
    name: Deploy PR preview
    environment:
      name: pr-preview/pr-${{ needs.resolve-pr.outputs.pr-number }}
      url: ${{ format('https://{0}.github.io/{1}/pr-preview/pr-{2}/', github.repository_owner, github.event.repository.name, needs.resolve-pr.outputs.pr-number) }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Deliberately no `ref:` override — for a `workflow_run` job this
      # checks out the repository's OWN default branch, never the PR's
      # branch. That's exactly what we want: this step only needs the repo
      # present for `rossjrw/pr-preview-action` to operate git against
      # `gh-pages`, not any content from the PR itself.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built site
        if: needs.resolve-pr.outputs.pr-action != 'remove'
        uses: actions/download-artifact@v7
        with:
          name: preview-site
          path: ./site/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          pr-number: ${{ needs.resolve-pr.outputs.pr-number }}
          action: ${{ needs.resolve-pr.outputs.pr-action }}
          wait-for-pages-deployment: true
