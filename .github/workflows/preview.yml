name: "PR Preview"

# WHY THIS IS ONE WORKFLOW, NOT A "BUILD HERE / DEPLOY THERE" SPLIT
# ---------------------------------------------------------------------------
# The previous design split this across four independent, top-level
# `pull_request`-triggered workflows: this one built the site; a
# `deploy-preview.yml`, triggered by `workflow_run` when this one completed,
# pushed it to gh-pages; and `console.yml`/`screenshots.yml` polled the
# resulting URL, using `fountainhead/action-wait-for-check` to wait on this
# workflow's own check first. That split existed to keep a write-capable
# token away from a fork PR's build step — GitHub forces a fork's
# `pull_request` token read-only regardless of declared `permissions:`, so
# the deploy had to live somewhere with its own, independently-granted token.
#
# The `workflow_run` hop turned out to be unreliable for release-please's
# PRs specifically: `deploy-preview.yml` never once fired for any commit
# PR #19 (a release-please PR) ever had, across its whole history, while
# firing normally for every human-authored PR. The cause was never
# conclusively pinned down at the GitHub-platform level — and isn't token
# identity: `Primajin/Gyros`'s `release-please.yml` uses the exact same
# `secrets.GITHUB_TOKEN` and its release-please PRs deploy previews fine,
# across 15+ releases, using the architecture below.
#
# That architecture avoids the question entirely rather than answering it:
# `deploy-preview`, `console`, and `screenshots` are jobs of THIS SAME
# workflow run, connected by `needs:` below. GitHub's own job-dependency
# graph provides the ordering — there is no second, independently-fired
# event for anything to fail to deliver. The fork-safety property is kept
# via an explicit `head.repo.full_name` check (both at the job level here,
# skipping console/screenshots entirely for a fork PR, and inside
# `_preview.yml` itself, guarding the actual `gh-pages` push) instead of
# relying on a separate trusted workflow.
on:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]

permissions: {}

jobs:
  deploy-preview:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_preview.yml
    secrets: inherit

  # Skipped (not run-and-failed) for a fork PR: its preview is never
  # deployed by `_preview.yml` above, so polling for it would only ever
  # time out. Same reasoning as the `if:` inside `_preview.yml`'s own
  # "Deploy preview" step.
  console:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy-preview
    permissions:
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_console.yml
    secrets: inherit

  screenshots:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy-preview
    permissions:
      checks: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_screenshots.yml
    secrets: inherit
