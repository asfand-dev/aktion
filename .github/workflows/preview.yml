name: Deploy PR previews

# Builds every PR (including from forks) with a READ-ONLY token and no
# secrets, then hands the built site off to the trusted `Deploy PR preview`
# workflow (deploy-preview.yml) via an artifact — that workflow does the
# actual deploy, using its OWN independently-derived idea of which PR this
# is and whether to deploy or remove, never anything this job claims (see
# its header comment for the full story: an earlier version of this job
# also wrote a `pr-metadata` artifact naming its own PR number/lifecycle
# action, which the trusted job then trusted outright — since THIS workflow
# file is itself read from the PR's own branch, a malicious PR could edit
# that step to claim to BE any other PR and had the trusted job deploying
# or deleting arbitrary previews on nothing but the attacker's say-so).
#
# This job stays `contents: read` — no more, ever — even for a same-repo
# PR. An earlier revision granted `contents: write`/`pull-requests: write`
# here for a temporary same-repo fallback deploy step, reasoning that forks
# are the only untrusted case since GitHub forces their token read-only
# regardless. That reasoning doesn't hold: a same-repo PR still runs THIS
# JOB'S OWN `npm ci`/`npm run build:preview` from the PR branch, and
# `actions/checkout` persists whatever token this job has into
# `.git/config` on disk — readable, and exfiltratable, by any of that
# untrusted build/install code (a malicious dependency, a compromised
# contributor account, a hostile `postinstall` script), independent of
# which specific step declared the need for write access. A same-repo PR
# not being from a fork does not make its build step's code trustworthy.
# The fallback was removed rather than patched.
#
# KNOWN, ACCEPTED, SELF-RESOLVING LIMITATION: `workflow_run` (which
# deploy-preview.yml listens on) only fires for a listener workflow that
# already exists on the repository's DEFAULT BRANCH — see that workflow's
# header comment. Until deploy-preview.yml is merged to `main`, NO PR gets
# a real preview deploy, including same-repo ones that deployed fine,
# same-job, before this split existed — their console-log/screenshot
# checks will fail waiting on a preview that was never deployed, exactly
# like a fork PR's always have. That is a real, known regression for the
# bootstrap window, and deliberately not patched around here: every way to
# avoid it either reintroduces the write-access-to-untrusted-code problem
# above, or requires standing up a second temporary trusted workflow just
# to retire immediately after the first one lands — more moving parts than
# a short-lived, well-understood, self-resolving gap justifies. It ends
# permanently the moment deploy-preview.yml reaches `main`.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    name: Make sure it builds. Then show a preview.
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build:preview
        env:
          VITE_BASE_PATH: /aktion/pr-preview/pr-${{ github.event.number }}/

      - name: Upload built site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: ./site/
          retention-days: 1
