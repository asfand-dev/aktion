name: Deploy PR previews

# Builds every PR (including from forks) with a read-only token and no
# secrets, then hands the result off to the trusted `Deploy PR preview`
# workflow (deploy-preview.yml) via artifacts. This job must NEVER be given
# write access — see that workflow's header comment for why the split
# exists and how the two halves talk to each other.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    name: Make sure it builds. Then show a preview.
    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build:preview
        env:
          VITE_BASE_PATH: /aktion/pr-preview/pr-${{ github.event.number }}/

      - name: Upload built site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: ./site/
          retention-days: 1

      # A `workflow_run` event (which the trusted deploy workflow triggers
      # on) carries only the id of the run that fired it — deliberately not
      # the pull_request payload that run itself saw, since that payload
      # would include data an attacker fully controls (PR number aside,
      # things like the PR title). Recording just the two fields the deploy
      # workflow actually needs, ourselves, keeps that trust boundary
      # explicit rather than relying on the runtime to sanitise a bigger
      # payload for us.
      - name: Record PR metadata for the trusted deploy workflow
        run: |
          mkdir -p ./pr-metadata
          cat > ./pr-metadata/pr.json <<JSON
          {"number": ${{ github.event.number }}, "action": "${{ github.event.action }}"}
          JSON

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: ./pr-metadata/
          retention-days: 1
